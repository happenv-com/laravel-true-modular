name: 'Copilot code review setup'

# Runner used by Copilot code review (and, as a fallback, the cloud agent).
# This repository is public, so it stays on GitHub-hosted runners - never on the
# self-hosted fleet, which must not execute code from public pull requests.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/copilot-code-review.yml'
  pull_request:
    paths:
      - '.github/workflows/copilot-code-review.yml'

permissions: {}

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
