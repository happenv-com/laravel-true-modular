name: fix-code-style

on:
  push:
    paths:
      - '**.php'

permissions:
  contents: write

jobs:
  fix-code-style:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: true is required so `git-auto-commit-action` below
      # can push the reformatted files back to the branch.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.3 # zizmor: ignore[artipacked]

      - name: Cache Composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.composer/cache/files
          key: composer-cs-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-cs-

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.5

      - name: Install dependencies
        run: composer install --no-interaction --no-scripts

      - name: Run Pint
        run: ./vendor/bin/pint

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: Fix styling